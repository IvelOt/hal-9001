[package]
name = "hal-9001"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
authors = ["IvelOt <contact@ivelot.dev>"]
description = "HAL-9001 — Central TUI de Controle do Sistema & Assistente de Sistema (Rust/ratatui)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/IvelOt/hal-9001"
homepage = "https://github.com/IvelOt/hal-9001"
documentation = "https://docs.rs/hal-9001"
keywords = ["tui", "system-monitor", "btop", "ratatui", "hardware-control"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [
    "assets/screenshots/*",
    "docs/*",
    "packaging/*",
    ".github/*",
]

[package.metadata.deb]
name = "hal-9001"
maintainer = "IvelOt <contact@ivelot.dev>"
copyright = "2026 IvelOt <contact@ivelot.dev>"
license-file = ["LICENSE", "4"]
extended-description = """\
HAL-9001 é uma central de controle e monitor de telemetria de sistema TUI \
moderno e de alta performance escrito em 100% Rust puro com Ratatui e D-Bus assíncrono. \
Permite monitorar CPU/RAM/Discos e controlar Wi-Fi, Bluetooth, Áudio (PipeWire/PulseAudio), \
Displays com auto-expansão e gravação de mídias/ISOs de forma segura."""
depends = "libc6 (>= 2.31) | libc6, libdbus-1-3, systemd"
recommends = "pipewire-bin | pulseaudio-utils, network-manager, bluez, udisks2, upower, x11-xserver-utils | wlr-randr"
section = "utils"
priority = "optional"
assets = [
    ["target/release/hal9001", "usr/bin/hal9001", "755"],
    ["config.toml", "etc/hal-9001/config.toml", "644"],
    ["README.md", "usr/share/doc/hal-9001/README.md", "644"],
    ["packaging/desktop/hal-9001.desktop", "usr/share/applications/hal-9001.desktop", "644"],
]

[[bin]]
name = "hal9001"
path = "src/main.rs"

[lib]
name = "hal9001"
path = "src/lib.rs"

[dependencies]
# --- TUI / terminal ---
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

# --- async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
tokio-util = "0.7"
futures = "0.3"

# --- system introspection ---
sysinfo = "0.32"

# --- D-Bus (NetworkManager / bluez / UDisks2 / UPower) ---
zbus = { version = "5", default-features = false, features = ["tokio"] }

# --- ISO Flasher (checksum + gravação de blocos) ---
sha2 = "0.10"
libc = "0.2"

# --- Formatação FAT32 100% Rust puro (zero dependências externas de host) ---
fatfs = "0.3.6"

# --- Descompressão em streaming do ISO Flasher (backend `miniz_oxide`, 100% Rust puro, zero bindings C/libz) ---
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# --- config / serde ---
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# --- utils ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
