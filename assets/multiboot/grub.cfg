set default=0
set timeout=15
set timeout_style=menu

insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod ext2
insmod iso9660
insmod loopback
insmod chain
insmod regexp
insmod search
insmod probe
insmod linux

insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
insmod png

search --no-floppy --set=mb_root --file /ISOs/.hal9001-multiboot
if [ -z "$mb_root" ]; then
    set mb_root="$root"
fi
export mb_root

probe --set=mb_uuid --fs-uuid ($mb_root)
export mb_uuid

if [ -n "$mb_uuid" ]; then
    set imgdevpath="/dev/disk/by-uuid/$mb_uuid"
else
    set imgdevpath=""
fi
export imgdevpath

set gfxmode=1280x800,1024x768,auto
terminal_output gfxterm

if [ -f ($mb_root)/boot/grub/themes/hal9001/theme.txt ]; then
    loadfont ($mb_root)/boot/grub/themes/hal9001/ascii.pf2
    loadfont ($mb_root)/boot/grub/themes/hal9001/unicode.pf2
    set theme=($mb_root)/boot/grub/themes/hal9001/theme.txt
fi

for isofile in ($mb_root)/ISOs/*.iso ($mb_root)/ISOs/*.ISO ; do
    if [ -f "$isofile" ]; then
        regexp --set=1:isoname '.*/([^/]+)\.[iI][sS][oO]$' "$isofile"
        set iso_relpath="$isofile"
        regexp --set=1:iso_relpath '^\([^)]+\)(/.*)$' "$isofile"
        menuentry "  [>] Boot: $isoname" "$isofile" "$iso_relpath" {
            set iso_full="$2"
            set iso_path="$3"
            export iso_path
            set isofile="$3"
            export isofile
            set isoboot="$3"
            export isoboot

            if [ -d (loop)/ ]; then
                loopback --delete loop
            fi

            if loopback loop "$iso_full"; then
                probe --set=iso_label --label (loop)
                export iso_label
                set root=(loop)

                # 1. loopback.cfg oficial (Ubuntu, Debian, Fedora, Arch modernos, GParted, etc.)
                if [ -f (loop)/boot/grub/loopback.cfg ]; then
                    configfile (loop)/boot/grub/loopback.cfg
                elif [ -f (loop)/boot/grub2/loopback.cfg ]; then
                    configfile (loop)/boot/grub2/loopback.cfg

                # 2. Ubuntu / Linux Mint / Pop!_OS / derivados Casper sem loopback.cfg
                elif [ -f (loop)/casper/vmlinuz ]; then
                    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$iso_path quiet splash ---
                    if [ -f (loop)/casper/initrd ]; then
                        initrd (loop)/casper/initrd
                    elif [ -f (loop)/casper/initrd.lz ]; then
                        initrd (loop)/casper/initrd.lz
                    elif [ -f (loop)/casper/initrd.gz ]; then
                        initrd (loop)/casper/initrd.gz
                    fi
                elif [ -f (loop)/casper/vmlinuz.efi ]; then
                    linux (loop)/casper/vmlinuz.efi boot=casper iso-scan/filename=$iso_path quiet splash ---
                    if [ -f (loop)/casper/initrd.lz ]; then
                        initrd (loop)/casper/initrd.lz
                    elif [ -f (loop)/casper/initrd ]; then
                        initrd (loop)/casper/initrd
                    fi

                # 3. Arch Linux / EndeavourOS / CachyOS / Garuda (archiso)
                elif [ -f (loop)/arch/boot/x86_64/vmlinuz-linux ]; then
                    linux (loop)/arch/boot/x86_64/vmlinuz-linux archisobasedir=arch img_dev=$imgdevpath img_loop=$iso_path earlymodules=loop
                    if [ -f (loop)/arch/boot/intel-ucode.img -a -f (loop)/arch/boot/amd-ucode.img ]; then
                        initrd (loop)/arch/boot/intel-ucode.img (loop)/arch/boot/amd-ucode.img (loop)/arch/boot/x86_64/initramfs-linux.img
                    else
                        initrd (loop)/arch/boot/x86_64/initramfs-linux.img
                    fi
                elif [ -f (loop)/arch/boot/x86_64/vmlinuz-linux-cachyos ]; then
                    linux (loop)/arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch img_dev=$imgdevpath img_loop=$iso_path earlymodules=loop
                    if [ -f (loop)/arch/boot/intel-ucode.img -a -f (loop)/arch/boot/amd-ucode.img ]; then
                        initrd (loop)/arch/boot/intel-ucode.img (loop)/arch/boot/amd-ucode.img (loop)/arch/boot/x86_64/initramfs-linux-cachyos.img
                    else
                        initrd (loop)/arch/boot/x86_64/initramfs-linux-cachyos.img
                    fi

                # 4. Manjaro (miso)
                elif [ -f (loop)/boot/vmlinuz-x86_64 ]; then
                    linux (loop)/boot/vmlinuz-x86_64 misobasedir=manjaro misolabel=$iso_label img_dev=$imgdevpath img_loop=$iso_path earlymodules=loop quiet splash
                    if [ -f (loop)/boot/initramfs-x86_64.img ]; then
                        initrd (loop)/boot/initramfs-x86_64.img
                    fi

                # 5. Debian / Kali / Tails / LMDE (live-boot)
                elif [ -f (loop)/live/vmlinuz ]; then
                    linux (loop)/live/vmlinuz boot=live components findiso=$iso_path quiet splash
                    if [ -f (loop)/live/initrd.img ]; then
                        initrd (loop)/live/initrd.img
                    elif [ -f (loop)/live/initrd.gz ]; then
                        initrd (loop)/live/initrd.gz
                    fi

                # 6. Fedora / RHEL / CentOS / Alma / Rocky (dracut dmsquash-live)
                elif [ -f (loop)/images/pxeboot/vmlinuz ]; then
                    linux (loop)/images/pxeboot/vmlinuz root=live:CDLABEL=$iso_label rd.live.image iso-scan/filename=$iso_path quiet
                    initrd (loop)/images/pxeboot/initrd.img
                elif [ -f (loop)/isolinux/vmlinuz ]; then
                    linux (loop)/isolinux/vmlinuz root=live:CDLABEL=$iso_label rd.live.image iso-scan/filename=$iso_path quiet
                    initrd (loop)/isolinux/initrd.img

                # 7. openSUSE Live / Tumbleweed (kiwi)
                elif [ -f (loop)/boot/x86_64/loader/linux ]; then
                    linux (loop)/boot/x86_64/loader/linux root=live:CDLABEL=$iso_label iso-scan/filename=$iso_path rd.live.image quiet splash
                    initrd (loop)/boot/x86_64/loader/initrd

                # 8. Fallback para grub.cfg interno da ISO
                elif [ -f (loop)/boot/grub/grub.cfg ]; then
                    export root
                    configfile (loop)/boot/grub/grub.cfg
                elif [ -f (loop)/EFI/BOOT/grub.cfg ]; then
                    export root
                    configfile (loop)/EFI/BOOT/grub.cfg
                else
                    echo "HAL-9001: Layout de boot nao reconhecido em $iso_path"
                    sleep 5
                    loopback --delete loop
                fi
            else
                echo "HAL-9001: Falha ao montar loopback para $iso_full"
                sleep 5
            fi
        }
    fi
done

for cfgfile in ($mb_root)/ISOs/*.cfg ; do
    if [ -f "$cfgfile" ]; then
        regexp --set=1:cfgname '.*/([^/]+)\.cfg$' "$cfgfile"
        menuentry "  [>] Boot (custom): $cfgname" "$cfgfile" {
            configfile "$2"
        }
    fi
done

menuentry "  --------------------------------------------------------------------------------" {
    true
}

menuentry "  [ ] Reboot Machine" {
    reboot
}

menuentry "  [ ] UEFI Firmware Setup" {
    fwsetup
}
