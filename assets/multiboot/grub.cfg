# grub.cfg — HAL-9001 lightweight embedded multi-boot menu.
#
# Deployed by `prepare_multiboot` (src/backend/multiboot.rs) to
# <mount>/boot/grub/grub.cfg on the FAT32 data partition of a prepared
# multi-boot drive. Paired with EFI/BOOT/BOOTX64.EFI (a standard GRUB EFI
# binary — see the README in this directory) this lets a UEFI machine boot
# straight into a menu that lists every .iso/.img placed under /ISOs on the
# same partition, without needing a separate installer/gadget per image.
#
# Design notes:
#   - Uses the `loopback` module so no ISO needs to be extracted: GRUB mounts
#     the ISO file itself as a virtual block device and chainloads whatever
#     bootloader lives inside it (works for most Linux live/install media
#     that ship an El Torito / hybrid ISO).
#   - Menu entries are generated dynamically at boot time via a `for` loop
#     over /ISOs/*.iso — adding or removing an ISO from the drive (see the
#     in-app ISO manager, key `G`) never requires touching this file again.
#   - Kept intentionally conservative/generic: it does not try to guess
#     kernel/initrd paths inside every possible distro ISO. Distros that need
#     bespoke boot parameters can drop a matching `<name>.cfg` snippet next
#     to their ISO under /ISOs/ (see the "Advanced / per-ISO override" menu
#     entry below) — this keeps the common case (`iso loopback boot`)
#     trivial while still allowing per-distro customization when needed.

set default=0
set timeout=15
set timeout_style=menu

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod loopback
insmod chain
insmod regexp
insmod search

# Locates the partition this grub.cfg itself was loaded from (the HAL-9001
# multi-boot data partition) and exposes it as $mb_root — every path below is
# relative to it, so this config keeps working regardless of which /dev node
# the drive enumerates as on a given boot.
search --no-floppy --set=mb_root --file /ISOs/.hal9001-multiboot

menuentry "HAL-9001 Multi-Boot" {
    true
}

# --- Dynamic menu: one entry per ISO under /ISOs -----------------------------
for isofile in ($mb_root)/ISOs/*.iso ; do
    regexp --set=isoname '.*/([^/]+)\.iso$' "$isofile"
    menuentry "Boot: $isoname" "$isofile" {
        set iso_path="$2"
        loopback loop "$iso_path"
        set root=(loop)
        # Generic ISOLINUX/GRUB-inside-ISO chainload path — covers the vast
        # majority of modern Linux live/install images (Debian/Ubuntu family,
        # Fedora, Arch, SystemRescue, ...). Distros with a nonstandard layout
        # can ship their own /ISOs/<name>.cfg (see below) to override this.
        if [ -f /boot/grub/x86_64-efi/core.efi ]; then
            configfile /boot/grub/grub.cfg
        elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
            chainloader /EFI/BOOT/BOOTX64.EFI
        else
            chainloader /isolinux/isolinux.bin
        fi
        loopback --delete loop
    }
done

# --- Per-ISO override: <mount>/ISOs/<name>.cfg, if present -------------------
# Lets an advanced user drop a hand-written snippet (correct kernel/initrd/
# boot params for a specific distro) without ever needing to touch this file.
for cfgfile in ($mb_root)/ISOs/*.cfg ; do
    regexp --set=cfgname '.*/([^/]+)\.cfg$' "$cfgfile"
    menuentry "Boot (custom): $cfgname" "$cfgfile" {
        configfile "$2"
    }
done

menuentry "Reboot" {
    reboot
}

menuentry "UEFI Firmware Setup" {
    fwsetup
}
