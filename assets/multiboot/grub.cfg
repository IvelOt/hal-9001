set default=0
set timeout=15
set timeout_style=menu

insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod ext2
insmod iso9660
insmod udf
insmod loopback
insmod chain
insmod regexp
insmod search

insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
insmod png

search --no-floppy --set=mb_root --file /ISOs/.hal9001-multiboot

set gfxmode=1280x800,1024x768,auto
terminal_output gfxterm

if [ -f ($mb_root)/boot/grub/themes/hal9001/theme.txt ]; then
    loadfont ($mb_root)/boot/grub/themes/hal9001/ascii.pf2
    loadfont ($mb_root)/boot/grub/themes/hal9001/unicode.pf2
    set theme=($mb_root)/boot/grub/themes/hal9001/theme.txt
fi

for isofile in ($mb_root)/ISOs/*.iso ($mb_root)/ISOs/*.img ; do
    if [ -f "$isofile" ]; then
        regexp --set=isoname '.*/([^/]+)\.(iso|img)$' "$isofile"
        menuentry "  [>] Boot: $isoname" "$isofile" {
            set iso_path="$2"
            loopback loop "$iso_path"
            set root=(loop)

            # 1. Debian / Ubuntu / Kali / Tails / Mint (Live ou Installer)
            if [ -f /install.amd/vmlinuz ]; then
                linux /install.amd/vmlinuz findiso=$iso_path priority=low vga=788
                initrd /install.amd/initrd.gz
            elif [ -f /casper/vmlinuz ]; then
                linux /casper/vmlinuz boot=casper iso-scan/filename=$iso_path quiet splash
                initrd /casper/initrd
            elif [ -f /live/vmlinuz ]; then
                linux /live/vmlinuz boot=live findiso=$iso_path components quiet splash
                initrd /live/initrd.img
            # 2. Arch Linux / Manjaro
            elif [ -f /arch/boot/x86_64/vmlinuz-linux ]; then
                linux /arch/boot/x86_64/vmlinuz-linux img_dev=$mb_root img_loop=$iso_path
                initrd /arch/boot/x86_64/initramfs-linux.img
            # 3. NixOS
            elif [ -f /boot/bzImage ]; then
                linux /boot/bzImage findiso=$iso_path
                initrd /boot/initrd
            # 4. Configfile GRUB interno da ISO
            elif [ -f /boot/grub/grub.cfg ]; then
                configfile /boot/grub/grub.cfg
            elif [ -f /EFI/BOOT/grub.cfg ]; then
                configfile /EFI/BOOT/grub.cfg
            # 5. Fallback UEFI chainloader
            elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
                chainloader /EFI/BOOT/BOOTX64.EFI
            elif [ -f /EFI/boot/bootx64.efi ]; then
                chainloader /EFI/boot/bootx64.efi
            elif [ -f /bootmgr.efi ]; then
                chainloader /bootmgr.efi
            fi
            loopback --delete loop
        }
    fi
done

for cfgfile in ($mb_root)/ISOs/*.cfg ; do
    if [ -f "$cfgfile" ]; then
        regexp --set=cfgname '.*/([^/]+)\.cfg$' "$cfgfile"
        menuentry "  [>] Boot (custom): $cfgname" "$cfgfile" {
            configfile "$2"
        }
    fi
done

menuentry "  --------------------------------------------------------------------------------" {
    true
}

menuentry "  [ ] Reboot Machine" {
    reboot
}

menuentry "  [ ] UEFI Firmware Setup" {
    fwsetup
}
