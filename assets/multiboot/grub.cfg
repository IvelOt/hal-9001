set default=0
set timeout=15
set timeout_style=menu

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod loopback
insmod chain
insmod regexp
insmod search

insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
insmod png

search --no-floppy --set=mb_root --file /ISOs/.hal9001-multiboot

set gfxmode=1280x800,1024x768,auto
terminal_output gfxterm

if [ -f ($mb_root)/boot/grub/themes/hal9001/theme.txt ]; then
    loadfont ($mb_root)/boot/grub/themes/hal9001/ascii.pf2
    loadfont ($mb_root)/boot/grub/themes/hal9001/unicode.pf2
    set theme=($mb_root)/boot/grub/themes/hal9001/theme.txt
fi

for isofile in ($mb_root)/ISOs/*.iso ; do
    if [ -f "$isofile" ]; then
        regexp --set=isoname '.*/([^/]+)\.iso$' "$isofile"
        menuentry "  [>] Boot: $isoname" "$isofile" {
            set iso_path="$2"
            loopback loop "$iso_path"
            set root=(loop)
            if [ -f /boot/grub/x86_64-efi/core.efi ]; then
                configfile /boot/grub/grub.cfg
            elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
                chainloader /EFI/BOOT/BOOTX64.EFI
            else
                chainloader /isolinux/isolinux.bin
            fi
            loopback --delete loop
        }
    fi
done

for cfgfile in ($mb_root)/ISOs/*.cfg ; do
    if [ -f "$cfgfile" ]; then
        regexp --set=cfgname '.*/([^/]+)\.cfg$' "$cfgfile"
        menuentry "  [>] Boot (custom): $cfgname" "$cfgfile" {
            configfile "$2"
        }
    fi
done

menuentry "  --------------------------------------------------------------------------------" {
    true
}

menuentry "  [ ] Reboot Machine" {
    reboot
}

menuentry "  [ ] UEFI Firmware Setup" {
    fwsetup
}
