name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hal9001
  PACKAGE_NAME: hal-9001

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compilation toolchain for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl-tools for static build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Extract version from Cargo.toml
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Create tarball
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          TARBALL="${PACKAGE_NAME}-${VERSION}-${{ matrix.target }}.tar.gz"

          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" staging/
          cp README.md LICENSE staging/

          tar -czf "${TARBALL}" -C staging .
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          retention-days: 5

  package-deb:
    name: Build Debian package
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-deb-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Extract version from Cargo.toml
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Generate Debian package
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          DEB_FILE="${PACKAGE_NAME}_${VERSION}_amd64.deb"
          cargo deb --no-build --output "${DEB_FILE}"
          echo "DEB_FILE=${DEB_FILE}" >> "$GITHUB_ENV"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_FILE }}
          path: ${{ env.DEB_FILE }}
          retention-days: 5

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, package-deb]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.deb" \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.tar.gz
            release-files/*.deb
            release-files/SHA256SUMS

  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        continue-on-error: true
        run: cargo publish --token "${{ secrets.CRATES_TOKEN }}" || true

  publish-aur:
    name: Publish to Arch User Repository (AUR)
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish hal-9001 (Source) to AUR
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/aur-src
          git clone ssh://aur@aur.archlinux.org/hal-9001.git /tmp/aur-src || (mkdir -p /tmp/aur-src && cd /tmp/aur-src && git init && git remote add origin ssh://aur@aur.archlinux.org/hal-9001.git)
          cp packaging/arch/PKGBUILD /tmp/aur-src/PKGBUILD
          cd /tmp/aur-src
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:latest bash -c "pacman -Syu --noconfirm base-devel sudo pacman-contrib && useradd -m builduser && chown -R builduser /pkg && sudo -u builduser updpkgsums && sudo -u builduser makepkg --printsrcinfo > .SRCINFO"
          sudo chown -R "$USER:$USER" /tmp/aur-src
          git config user.name "IvelOt"
          git config user.email "contact@ivelot.dev"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION}"
            git push origin master
          fi

      - name: Publish hal-9001-bin (Precompiled) to AUR
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/aur-bin
          git clone ssh://aur@aur.archlinux.org/hal-9001-bin.git /tmp/aur-bin || (mkdir -p /tmp/aur-bin && cd /tmp/aur-bin && git init && git remote add origin ssh://aur@aur.archlinux.org/hal-9001-bin.git)
          cp packaging/arch/PKGBUILD.bin /tmp/aur-bin/PKGBUILD
          cd /tmp/aur-bin
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:latest bash -c "pacman -Syu --noconfirm base-devel sudo pacman-contrib && useradd -m builduser && chown -R builduser /pkg && sudo -u builduser updpkgsums && sudo -u builduser makepkg --printsrcinfo > .SRCINFO"
          sudo chown -R "$USER:$USER" /tmp/aur-bin
          git config user.name "IvelOt"
          git config user.email "contact@ivelot.dev"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Release v${VERSION}"
            git push origin master
          fi
